name: fNIRS Edge Device Update

on:
  workflow_dispatch:
  push:
    branches: [ "fnirs-edge" ]

jobs:
  Edge-Device-Update:
    runs-on: ubuntu-latest
    steps:

    - name: main Branch Checkout
      uses: actions/checkout@v4
      with:
        ref: fnirs-edge

    - name: ZeroTier Login
      uses: zerotier/github-action@v1
      with:
        network_id: ${{ secrets.ZEROTIER_NETWORK }}
        auth_token: ${{ secrets.ZEROTIER_TOKEN }}

    - name: Check ZeroTier Host Connectivity
      shell: bash
      run: |
        count=5
        while ! ping -c 1 ${{ secrets.GOOGLE_VM_ZEROTIER_IP }} ; do
          echo "waiting..." ;
          sleep 1 ;
          let count=count-1
        done
        echo "ZeroTier Host Available"
    
    - name: Setup Node & NPM
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Build Captive Portal
      shell: bash
      run:  |
        cd ./frontend
        npm install
        npm run build
        cd ../
      
    - name: Build Installation Package
      shell: bash
      run: |
        chmod 777 ./package.sh
        ./package.sh
    
    - name: Marking the New Version
      run: echo ${{ github.sha }} > ./version

    - name: Generating SSH Key
      run: echo "${{ secrets.GOOGLE_VM_FNIRS_KEY }}" > ./tempKey
    
    - name: Setting Permission to SSH Key
      run: chmod 600 ./tempKey
    
    - name: Transferring Payload
      shell: bash
      run: |
        scp -o "StrictHostKeyChecking no" -i ./tempKey ./package.tar ${{ secrets.GOOGLE_VM_USER }}@${{ secrets.GOOGLE_VM_ZEROTIER_IP }}:/home/${{ secrets.GOOGLE_VM_USER }}/
        scp -o "StrictHostKeyChecking no" -i ./tempKey ./version ${{ secrets.GOOGLE_VM_USER }}@${{ secrets.GOOGLE_VM_ZEROTIER_IP }}:/home/${{ secrets.GOOGLE_VM_USER }}/ /var/www/html/ftpServer/fnirsEdgeDevice/
        scp -o "StrictHostKeyChecking no" -i ./tempKey ./install.sh ${{ secrets.GOOGLE_VM_USER }}@${{ secrets.GOOGLE_VM_ZEROTIER_IP }}:/home/${{ secrets.GOOGLE_VM_USER }}/ /var/www/html/ftpServer/fnirsEdgeDevice/
        ssh -o "StrictHostKeyChecking no" -i ./tempKey ${{ secrets.GOOGLE_VM_USER }}@${{ secrets.GOOGLE_VM_ZEROTIER_IP }} sudo mv /home/${{ secrets.GOOGLE_VM_USER }}/package.tar /var/www/html/ftpServer/fnirsEdgeDevice/package.tar
        ssh -o "StrictHostKeyChecking no" -i ./tempKey ${{ secrets.GOOGLE_VM_USER }}@${{ secrets.GOOGLE_VM_ZEROTIER_IP }} sudo mv /home/${{ secrets.GOOGLE_VM_USER }}/version /var/www/html/ftpServer/fnirsEdgeDevice/version
        ssh -o "StrictHostKeyChecking no" -i ./tempKey ${{ secrets.GOOGLE_VM_USER }}@${{ secrets.GOOGLE_VM_ZEROTIER_IP }} sudo mv /home/${{ secrets.GOOGLE_VM_USER }}/install.sh /var/www/html/ftpServer/fnirsEdgeDevice/install.sh

