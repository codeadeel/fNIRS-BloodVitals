name: DockerHub x64 Image Push

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  Docker-x64-Build:
    runs-on: ubuntu-latest
    steps:

    - name: main Branch Checkout
      uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v3.3.0
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_PASSWORD}}
    
    - name: Build Web Portal
      run: docker build -t ${{secrets.DOCKER_USER}}/private:fnirswebapp .

    - name: Push Build Container
      run: docker push ${{secrets.DOCKER_USER}}/private:fnirswebapp

    - name: Residue Removal
      run: docker rmi $(docker images -a -q)
